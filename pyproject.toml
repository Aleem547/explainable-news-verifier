[project]
name = "explainable-news-verifier"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "datasets>=5.0.1",
    "duckdb>=1.5.6",
    "dvc>=3.67.1",
    "evaluate>=0.4.6",
    "fastapi>=0.142.2",
    "great-expectations>=1.23.2",
    "httpx>=0.28.1",
    "mlflow>=3.16.1",
    "orjson>=3.12.0",
    "pandas>=3.0.6",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "sqlalchemy[asyncio]>=2.1.2",
    "structlog>=26.1.0",
    "tantivy>=0.26.2",
    "transformers>=5.18.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]


[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true
