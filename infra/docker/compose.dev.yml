
name: explainable-news-verifier-dev

services:

  # ==========================================
  # PostgreSQL 17 - Application Database
  # ==========================================

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - verifier_network


  # ==========================================
  # Redis 8 - Cache and Supporting Services
  # ==========================================

  redis:
    image: redis:8-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - verifier_network


  # ==========================================
  # Qdrant - Vector Database
  # ==========================================

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped

    ports:
      - "${QDRANT_HTTP_PORT}:6333"
      - "${QDRANT_GRPC_PORT}:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - verifier_network


  # ==========================================
  # MLflow - Experiment and Artifact Tracking
  # ==========================================

  mlflow:
    build:
      context: ./mlflow
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    command:
      - mlflow
      - server
      - --backend-store-uri
      - postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      - --serve-artifacts
      - --artifacts-destination
      - /mlartifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"

    ports:
      - "${MLFLOW_PORT}:5000"

    volumes:
      - mlflow_artifacts:/mlartifacts

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - verifier_network


  # ==========================================
  # FastAPI - AI Verification Backend
  # ==========================================

  api:
    image: verifier-api:10c3.1

    build:
      context: ../..
      dockerfile: infra/docker/api/Dockerfile

    # ========================================
    # Phase 11C.2 - Resource Hardening
    # ========================================

    # Initial CPU limit: 8 logical CPUs
    cpus: "8.0"

    # Initial maximum container memory: 3 GiB
    mem_limit: 3g

    # Maximum number of process/thread IDs
    pids_limit: 512

    # ========================================
    # Environment Configuration
    # ========================================

    env_file:
      - ../../.env
      - ../../.env.docker

    # ========================================
    # Persistent Data and Model Mounts
    # ========================================

    volumes:

      # Original trained models remain read-only
      - ../../models:/app/models:ro

      # Original inference data remains read-only
      - ../../data:/app/data:ro

      # Separate writable Tantivy runtime index
      # Original BM25 index remains protected
      - ../../docker-data/page_bm25:/app/data/indexes/fever/page_bm25:rw

      # Persistent Hugging Face model cache
      - verifier_hf_cache:/home/verifier/.cache/huggingface

    # ========================================
    # Network and Service Dependencies
    # ========================================

    ports:
      - "127.0.0.1:8001:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      qdrant:
        condition: service_started

    networks:
      - verifier_network

    # ========================================
    # API Health Check
    # ========================================

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json; from urllib.request import urlopen; data = json.load(urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=5)); assert data.get('ready') is True"

      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 120s

    # ========================================
    # Phase 11B - Graceful Shutdown
    # ========================================

    # Forward signals and reap child processes
    init: true

    # Allow active inference time to finish
    # before Docker forcibly terminates the API.
    # Not a guarantee if inference exceeds this.
    stop_grace_period: 90s

    restart: unless-stopped


# ==========================================
# Persistent Docker Volumes
# ==========================================

volumes:

  postgres_data:

  redis_data:

  qdrant_data:

  mlflow_artifacts:

  verifier_hf_cache:


# ==========================================
# Docker Networks
# ==========================================

networks:

  verifier_network:
    driver: bridge
